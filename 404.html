    .lost-stars i:nth-child(1){left:12%;top:22%;--duration:11s}.lost-stars i:nth-child(2){left:84%;top:18%;--duration:15s}.lost-stars i:nth-child(3){left:77%;top:76%;--duration:13s}.lost-stars i:nth-child(4){left:19%;top:81%;--duration:17s}.lost-stars i:nth-child(5){left:52%;top:9%;--duration:10s}.lost-stars i:nth-child(6){left:91%;top:54%;--duration:19s}.lost-stars i:nth-child(7){left:6%;top:57%;--duration:14s}.lost-stars i:nth-child(8){left:64%;top:91%;--duration:16s}
    body[data-lost-theme="day"] .lost-stars i { background:#7b9eb6; box-shadow:0 0 9px #7b9eb6; opacity:.65; }
    @keyframes lost-scan { to { transform:rotate(360deg); } }
    @keyframes lost-orbit { to { transform:rotate(360deg); } }
    @keyframes lost-float { 0%,100%{translate:0 0} 50%{translate:0 -9px} }
    @keyframes lost-blink { 0%,44%,48%,100%{transform:scaleY(1)} 46%{transform:scaleY(.08)} }

    @media (max-width:520px) {

    }
    @media (prefers-reduced-motion: reduce) {

  <script>
    (function () {
      var body = document.body;
      var themeButton = document.getElementById("lostThemeToggle");
      var themeLabel = document.getElementById("lostThemeLabel");
      var themeIcon = document.getElementById("lostThemeIcon");
      var face = document.getElementById("lostFace");
      var message = document.getElementById("lostMessage");
      if (!body || !themeButton || !face || !message) return;

      var day = false;
      themeButton.addEventListener("click", function () {
        day = !day;
        body.setAttribute("data-lost-theme", day ? "day" : "night");
        themeButton.setAttribute("aria-pressed", day ? "true" : "false");
        themeButton.setAttribute("aria-label", day ? "Switch to night theme" : "Switch to day theme");
        themeLabel.textContent = day ? "Night mode" : "Day mode";
        themeIcon.textContent = day ? "☾" : "☀";
      });

      var reactions = [
        "Scanning the area for your page…",
        "No signal. Just vibes.",
        "This page must be on a side quest.",
        "Have you tried the Home button?",
        "The little face says: wrong turn!"
      ];
      var reactionIndex = 0;
      face.addEventListener("click", function () {
        face.classList.toggle("is-curious");
        message.textContent = face.classList.contains("is-curious")
          ? "Oh! You found me. Still looking for that page, though."
          : "Back to scanning. Good luck out there!";
      });

      if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        window.setInterval(function () {
          reactionIndex = (reactionIndex + 1) % reactions.length;
          message.textContent = reactions[reactionIndex];
        }, 6500);
      }
    })();
  </script>
